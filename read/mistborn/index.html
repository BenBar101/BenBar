<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mistborn Trilogy</title>
<style>
body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 42rem;
    margin: 0 auto;
    padding: 1.5rem 1rem;
    background: #121212;
    color: #f1f1f1;
}
h1 {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
}
.subtitle {
    color: #aaa;
    margin-bottom: 2rem;
    font-size: 1.05rem;
}
.book-grid {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
.book-card {
    display: flex;
    flex-direction: column;
    background: #1e1e1e;
    border: 1px solid #333;
    padding: 1.25rem 1.5rem;
    border-radius: 10px;
    text-decoration: none;
    color: white;
    transition: background 0.2s, transform 0.1s, border-color 0.2s;
}
.book-card:hover {
    background: #282828;
    border-color: #555;
    transform: translateY(-2px);
}
.book-tag {
    font-size: 0.85rem;
    color: #90caf9;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: bold;
    margin-bottom: 0.25rem;
}
.book-title {
    font-size: 1.35rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
}
.book-info {
    color: #888;
    font-size: 0.95rem;
}
</style>
</head>
<body>
<h1>Mistborn Trilogy</h1>
<p class="subtitle">Select a book to read without chapter spoilers:</p>
<div class="book-grid">
    <a class="book-card" href="book1.html">
        <span class="book-tag">Book 1</span>
        <span class="book-title">The Final Empire</span>
        <span class="book-info">57 sections • Start reading →</span>
    </a>
    <a class="book-card" href="book2.html">
        <span class="book-tag">Book 2</span>
        <span class="book-title">The Well of Ascension</span>
        <span class="book-info">79 sections • Start reading →</span>
    </a>
    <a class="book-card" href="book3.html">
        <span class="book-tag">Book 3</span>
        <span class="book-title">The Hero of Ages</span>
        <span class="book-info">98 sections • Start reading →</span>
    </a>
</div>
</body>
</html>
