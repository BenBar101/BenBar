<!-- Ink Plugin CSS Fixes for HTML Export -->
<style>
/* Fix Ink plugin SVG visibility and sizing */
.ddc_ink_embed {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    margin: 20px 0 !important;
    position: relative !important;
}

.ddc_ink_resize-container {
    position: relative !important;
    width: 100% !important;
    padding-bottom: 41.25% !important; /* 825/2000 aspect ratio */
    overflow: hidden !important;
}

.ddc_ink_writing-embed-preview {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
}

.ddc_ink_writing-embed-preview svg {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    object-fit: contain !important;
}

/* Ensure SVG paths are visible */
.ddc_ink_writing-embed-preview svg path {
    stroke: #000000 !important;
    fill: #f2f2f2 !important;
    stroke-width: 2 !important;
}

.ddc_ink_writing-embed-preview svg line {
    stroke: #e0e0e0 !important;
    stroke-width: 1 !important;
}

/* Fix for block container */
.block-language-handwritten-ink {
    display: block !important;
    width: 100% !important;
    margin: 20px 0 !important;
}
</style>
