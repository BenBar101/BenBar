<!-- Ink Plugin CSS Fixes for HTML Export -->
<style>
/* Fix Ink plugin container to be in document flow */
.el-pre .block-language-handwritten-ink {
    display: block !important;
    width: 100% !important;
    margin: 20px 0 !important;
    position: relative !important;
    clear: both !important;
}

.ddc_ink_embed {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    position: relative !important;
}

.ddc_ink_resize-container {
    position: relative !important;
    width: 100% !important;
    padding-bottom: 41.25% !important; /* 825/2000 aspect ratio */
    overflow: hidden !important;
    margin: 0 !important;
}

.ddc_ink_writing-embed-preview {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;

    height: 100% !important;
}

    width: 100% !important;

    stroke: none !important;
}

.ddc_ink_writing-embed-preview svg line {
    stroke: #e0e0e0 !important;
    stroke-width: 1 !important;
}

.el-pre {
    position: relative !important;
    display: block !important;
