name: Add MathJax to HTML files

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.html'

jobs:
  add-mathjax:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Add MathJax to HTML files
        run: |
          # Find all HTML files and add MathJax to their head section
          find . -name "*.html" -type f | while read file; do
            # Check if MathJax is already in the file
            if ! grep -q "mathjax" "$file"; then
              # Create a temporary file with MathJax script injected
              temp_file="${file}.tmp"
              
              # Insert MathJax script before </head>
              sed '/<\/head>/i\    <script>\n      MathJax = {\n        tex: {\n          inlineMath: [['\''$'\'', '\''$'\''], ['\''\\\\('\'', '\''\\\\)'\'']],\n          displayMath: [['\''$$'\'', '\''$$'\''], ['\''\\\\['\'', '\''\\\\]'\'']]\n        }\n      };\n    <\/script>\n    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"><\/script>' "$file" > "$temp_file"
              
              mv "$temp_file" "$file"
              echo "Added MathJax to: $file"
            else
              echo "MathJax already present in: $file"
            fi
          done
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: inject MathJax into HTML files" || echo "No changes to commit"
      
      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.LATEX }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.LATEX }}@github.com/${{ github.repository }}.git
          git push
