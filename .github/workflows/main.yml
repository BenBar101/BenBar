name: Add MathJax to HTML files

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.html'

jobs:
  add-mathjax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Add MathJax to HTML files
        run: |
          find . -name "*.html" -type f | while read file; do
            if ! grep -q "mathjax" "$file"; then
              python3 << 'EOF'
          import sys
          import re
          
          file_path = "$file"
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          mathjax_script = '''    <script>
              MathJax = {
                tex: {
                  inlineMath: [['$', '$'], ['\\\\(', '\\\\)']],
                  displayMath: [['$$', '$$'], ['\\\\[', '\\\\]']]
                }
              };
            </script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>'''
          
          content = re.sub(r'</head>', mathjax_script + '\n</head>', content, flags=re.IGNORECASE)
          
          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)
          
          print(f"Added MathJax to: {file_path}")
          EOF
            else
              echo "MathJax already present in: $file"
            fi
          done

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: inject MathJax into HTML files" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.LATEX }}
          branch: ${{ github.ref }}
