<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טלוויזיית הליכון</title>
    
    <!-- טעינת העיצוב והסקריפט של Lite YouTube Embed מ-CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lite-youtube-embed/0.3.2/lite-yt-embed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lite-youtube-embed/0.3.2/lite-yt-embed.min.js"></script>
    
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .video-container {
            width: 100%;
            max-width: 800px; /* מתאים למסך של הליכון/טאבלט */
        }
        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>האימון של היום 💪</h1>

    <div class="video-container">
        <lite-youtube videoid="videoseries" params="list=PLvONfxPasj2icajiAR_jDZ2kWjbk2hKhA" playlabel="נגן פלייליסט"></lite-youtube>
    </div>

</body>
</html>
